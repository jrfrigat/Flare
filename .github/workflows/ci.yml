name: CI

# Build + test + packaging validation on every push/PR. Publishing lives in separate workflows:
#   release.yml  - pushes NuGet packages on  v*         tags
#   gallery.yml  - builds/pushes the Docker image on gallery-v* tags
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # Compile once. The four test suites and the gate all work from this artifact, so the solution is
  # not rebuilt five times and the suites can run at the same time.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history/tags to compute the version

      # The libraries multi-target net8.0/net9.0/net10.0, so all three SDKs (and their targeting
      # packs/runtimes) are needed to build and run-test every TFM. The latest SDK (10) drives the build.
      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Flare.slnx

      - name: Build (Release)
        run: dotnet build Flare.slnx -c Release --no-restore

      # Both bin and obj travel: --no-build in a test job still evaluates the project and reads the
      # generated props, targets and project.assets.json under obj/Release.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            **/bin/Release/**
            **/obj/Release/**
          if-no-files-found: error
          retention-days: 1

  # Four suites, in parallel. fail-fast is off on purpose: one red suite must not hide whether the
  # others also broke. Every project runs even after one fails, and the job fails at the end so the
  # TRX and coverage of the other projects still get published.
  #
  # The browser suite is deliberately absent: it drives a real Chromium against a live server, and a
  # slow runner fails it without a defect. It stays in the repository and is run by hand.
  test:
    name: Test (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: components
            projects: tests/Flare.Components.Tests/Flare.Components.Tests.csproj
          - suite: core
            projects: tests/Flare.Core.Tests/Flare.Core.Tests.csproj
          - suite: guards
            projects: tests/Flare.Guards.Tests/Flare.Guards.Tests.csproj
          - suite: packages
            projects: |
              tests/Flare.ApiDocGen.Tests/Flare.ApiDocGen.Tests.csproj
              tests/Flare.Components.Barcode.Tests/Flare.Components.Barcode.Tests.csproj
              tests/Flare.Components.Carousel.Tests/Flare.Components.Carousel.Tests.csproj
              tests/Flare.Components.Gantt.Tests/Flare.Components.Gantt.Tests.csproj
              tests/Flare.Components.IDE.Tests/Flare.Components.IDE.Tests.csproj
              tests/Flare.Components.Kanban.Tests/Flare.Components.Kanban.Tests.csproj
              tests/Flare.Components.Media.Tests/Flare.Components.Media.Tests.csproj
              tests/Flare.Components.QrCode.Tests/Flare.Components.QrCode.Tests.csproj
              tests/Flare.Components.Query.Tests/Flare.Components.Query.Tests.csproj
              tests/Flare.Components.RichTextEditor.Tests/Flare.Components.RichTextEditor.Tests.csproj
              tests/Flare.Components.Transfer.Tests/Flare.Components.Transfer.Tests.csproj
              tests/Flare.Integration.Tests/Flare.Integration.Tests.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: build-output

      # Actions artifacts do not preserve the Unix executable bit, so the apphost the build produced is
      # 644 after download and dotnet test reports "Zero tests ran" with Permission denied. Restore it on
      # the apphosts only: the extension-less Flare.*Tests binaries (not their DLLs beside them).
      - name: Restore the executable bit
        run: find . -path '*/bin/Release/*' -type f \( -name 'Flare.*Tests' -o -name 'Flare.ApiDocGen' \) ! -name '*.dll' -exec chmod +x {} +

      # --no-build runs the compiled artifact; restore is still needed because the test host resolves
      # the Microsoft.Testing.Platform extensions through the generated NuGet props in obj/.
      - name: Restore
        run: dotnet restore Flare.slnx

      # MTP options, not VSTest ones: xunit.v3 4.0.0 runs on Microsoft.Testing.Platform (global.json
      # picks the runner), where VSTest's --logger is accepted and silently ignored. --report-trx
      # comes from Microsoft.Testing.Extensions.TrxReport and --coverlet from coverlet.MTP; both leave
      # TestResults/ per project and TFM. Coverage files are moved under coverage/<project>/ so the
      # badge script can attribute them to a suite.
      - name: Test (${{ matrix.suite }})
        shell: bash
        run: |
          status=0
          while read -r project; do
            [ -n "$project" ] || continue
            name=$(basename "$project" .csproj)
            dotnet test --project "$project" -c Release --no-build \
              --report-trx --coverlet --coverlet-output-format cobertura || status=1
            for file in TestResults/coverage.cobertura.*.xml; do
              [ -e "$file" ] || continue
              mkdir -p "TestResults/coverage/$name"
              mv "$file" "TestResults/coverage/$name/$(basename "$file")"
            done
          done <<< "${{ matrix.projects }}"
          exit $status

      - name: Upload ${{ matrix.suite }} results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.suite }}
          path: TestResults
          if-no-files-found: ignore

  # JavaScript unit tests run the browser scripts in jsdom. One piece of JS - the rich text editor's
  # HTML filter - is a security boundary, so it is a gate of its own rather than a manual step.
  # jsdom implements no Element.setHTML, so what CI covers is the DOMParser fallback: our own code.
  # The platform path is the engine's and is exercised in a real browser, not here.
  js:
    name: Test (JavaScript)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/Flare.Js.Tests/package-lock.json

      - name: Test (JavaScript)
        working-directory: tests/Flare.Js.Tests
        run: |
          npm ci
          npm test

  # The check the main ruleset requires BY NAME. It keeps that name while the suites move into their
  # own jobs, so branch protection stays valid. It runs even when a suite failed, reports the reason,
  # and only then fails itself - which is what makes one required check represent all of them.
  build-test:
    name: Build, test & validate packaging
    needs: [ build, test, js ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the build or a test suite failed
        if: needs.build.result != 'success' || needs.test.result != 'success' || needs.js.result != 'success'
        run: |
          echo "build=${{ needs.build.result }} test=${{ needs.test.result }} js=${{ needs.js.result }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history/tags to compute the version

      - name: Setup .NET (10)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: build-output

      # Same lost executable bit as the test jobs: dotnet run --no-build starts the ApiDocGen apphost.
      - name: Restore the executable bit
        run: find . -path '*/bin/Release/*' -type f \( -name 'Flare.*Tests' -o -name 'Flare.ApiDocGen' \) ! -name '*.dll' -exec chmod +x {} +

      - name: Restore
        run: dotnet restore Flare.slnx

      # The API reference is a generated file that is COMMITTED, so it rots silently: a parameter added
      # without re-running the generator leaves the published reference describing the previous shape.
      # This check also runs in release.yml, but a release is the wrong place to LEARN about the drift -
      # by then the tag is cut and has to be moved. Fix by running the generator and committing:
      #   dotnet build samples/Flare.Gallery/Flare.Gallery.csproj -p:RunApiDocGen=true
      - name: Verify the API reference is current
        run: |
          # Exercise localized defaults under both developer and runner locales.
          for locale in ru_RU.UTF-8 en_US.UTF-8; do
            LANG="$locale" LC_ALL="$locale" dotnet run --project tools/Flare.ApiDocGen -c Release --no-build -- samples/Flare.Gallery/Api/ComponentApiRegistry.g.cs --markdown docs/api
            git diff --exit-code -- samples/Flare.Gallery/Api/ComponentApiRegistry.g.cs docs/api
          done

      # Pack here too so a packaging break (missing README/icon, CS1591, etc.) fails CI, not release.
      # IsPackable=false on Gallery/tests/tools means only the publishable packages are produced.
      - name: Pack (validation only)
        run: dotnet pack Flare.slnx -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  # Publishes the eight badge JSON files to the orphan `badges` branch. Runs even when a suite failed:
  # a badge that only updates when everything passes is a badge that lies exactly when it matters.
  # Only a push to main publishes; pull requests run against a read-only token and are not main's
  # numbers anyway.
  badges:
    name: Publish badges
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          path: TestResults
          merge-multiple: true

      - name: Write badge JSON
        shell: pwsh
        run: ./scripts/ci-badges.ps1 -Results TestResults -Out badges

      - name: Push to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd badges
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan badges
          git add -A
          git commit -q -m "Update CI badges"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
